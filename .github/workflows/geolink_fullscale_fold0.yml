name: Geolink fold-0 full-scale CLP validation
on:
  push:
    branches:
      - audit/geolink-fold0-fullscale-20261021
permissions:
  contents: read
jobs:
  fullscale:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install scientific dependencies
        run: |
          pip install -q numpy pandas scipy scikit-learn matplotlib
          pip install -q torch
      - name: Download verified original Geolink processed archive
        run: |
          mkdir -p /tmp/geolink
          curl --fail --location --silent --show-error \
            --retry 3 --connect-timeout 20 --max-time 1800 \
            -o /tmp/geolink/public-processed-datasets.tar.gz \
            "https://zenodo.org/records/10987946/files/public-processed-datasets.tar.gz?download=1"
          echo "67a659043770fab643d60d4d8fd674da50d178797f49e664d8c9abdc532a7aa6  /tmp/geolink/public-processed-datasets.tar.gz" | sha256sum --check
      - name: Full fold-0 well-disjoint CLP and baselines
        env:
          PYTHONPATH: '.'
          PYTHONUNBUFFERED: '1'
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '2'
        run: |
          python scripts/geolink_fullscale/run_fold0.py \
            --archive /tmp/geolink/public-processed-datasets.tar.gz \
            --out outputs/geolink_full_fold0
      - name: Upload all metrics even on errors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geolink-fullscale-fold0-clp-metrics
          path: outputs/geolink_full_fold0/
          if-no-files-found: warn
